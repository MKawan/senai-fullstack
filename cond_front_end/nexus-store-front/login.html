<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Nexus Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles02.css" />
</head>

<body>
    <header class="topbar">
        <div class="container d-flex align-items-center justify-content-between py-3">
            <a class="brand" href="index.html">NEX<span>US</span></a>
            <nav class="nav-links d-none d-md-flex gap-4 align-items-center">
                <a href="index.html#categorias">Categorias</a>
                <a href="index.html#produtos">Produtos</a>
                <a href="index.html#promocoes">Promoções</a>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <div class="container py-5">
            <div class="row align-items-center g-5">
                <div class="col-lg-6">
                    <p class="eyebrow">Acesso rápido</p>
                    <h1>Entre na sua conta e continue sua compra.</h1>
                    <p class="lead">Acompanhe pedidos, receba ofertas exclusivas e aproveite o melhor da loja gamer.</p>
                </div>
                <div class="col-lg-6">
                    <form id="loginForm" class="auth-card">
                        <h2>Login</h2>
                        <div class="mb-3">
                            <label class="form-label" for="loginEmail">E-mail</label>
                            <input class="form-control" id="loginEmail" name="email" type="email" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="loginPassword">Senha</label>
                            <input class="form-control" id="loginPassword" name="password" type="password" required />
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" id="remember" type="checkbox" />
                            <label class="form-check-label" for="remember">Lembrar de mim</label>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Entrar</button>
                        <p class="small mt-3">Ainda não tem conta? <a href="register.html">Cadastre-se</a></p>
                        <p class="feedback mt-3" id="loginFeedback" aria-live="polite"></p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container d-flex justify-content-between flex-wrap gap-2 py-4">
            <span>© <span id="year"></span> Nexus Store. Todos os direitos reservados.</span>
            <a href="index.html">Voltar à loja</a>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
