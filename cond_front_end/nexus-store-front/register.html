<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro | Nexus Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles02.css" />
</head>

<body>
    <header class="topbar">
        <div class="container d-flex align-items-center justify-content-between py-3">
            <a class="brand" href="index.html">NEX<span>US</span></a>
        </div>
    </header>

    <main class="auth-page">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <form id="registerForm" class="auth-card">
                        <h2>Crie sua conta</h2>
                        <p class="lead">Acesse promoções e acompanhe seus pedidos.</p>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="name">Nome</label>
                                <input class="form-control" id="name" name="name" type="text" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="registerEmail">E-mail</label>
                                <input class="form-control" id="registerEmail" name="email" type="email" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="registerPassword">Senha</label>
                                <input class="form-control" id="registerPassword" name="password" type="password"
                                    required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="confirmPassword">Confirmar senha</label>
                                <input class="form-control" id="confirmPassword" name="confirmPassword" type="password"
                                    required />
                            </div>
                        </div>
                        <div class="form-check mt-3">
                            <input class="form-check-input" id="accept" type="checkbox" required />
                            <label class="form-check-label" for="accept">Aceito receber ofertas por e-mail.</label>
                        </div>
                        <button class="btn btn-primary w-100 mt-4" type="submit">Cadastrar</button>
                        <p class="small mt-3">Já possui conta? <a href="login.html">Entrar</a></p>
                        <p class="feedback mt-3" id="registerFeedback" aria-live="polite"></p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container d-flex justify-content-between flex-wrap gap-2 py-4">
            <span>© <span id="year"></span> Nexus Store. Todos os direitos reservados.</span>
            <a href="index.html">Voltar à loja</a>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
